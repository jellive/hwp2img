name: test

# ★이 워크플로의 값어치는 "테스트를 또 돌리는 것" 이 아니다.
#   이 프로젝트는 **Windows 에서 테스트를 단 한 번도 돌려본 적이 없다** — 개발이 Mac 이고
#   실행은 Windows 전용이라, 그 간극이 통째로 미검증이었다. windows-latest 러너가 그
#   표면을 처음으로 열어 준다.
#
# ⚠️ 러너에는 한컴오피스가 없다. 그래서 여기서 도는 것은 COM 경계 **바깥**뿐이다 —
#   실제 .hwp → PDF 변환, pyhwpx import 부작용, 보안모듈 레지스트리 등록은 여전히
#   어머니 PC 급 실기기에서만 확인된다. 테스트 95개는 전부 의존성 주입이라 COM 없이 돈다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Windows 만 깨지는지 Mac 도 깨지는지 한 번에 봐야 한다
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # 3.11 고정 — 실제로 검증된 유일한 조합이다(.python-version).
      # pyproject 의 requires-python 은 하한선만 걸어 둬서 그냥 두면 더 넓은 버전을 쓴다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # requirements.txt 의 플랫폼 마커가 러너에서 어떤 분기로 풀렸는지 로그에 남긴다.
      # Mac 에서 잠긴 집합과 Windows 가 실제로 설치하는 집합은 다르다(크로스모델 지적).
      - name: 실제로 설치된 것 기록
        run: pip freeze

      - name: pytest
        run: pytest -v
