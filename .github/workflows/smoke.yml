name: smoke

# 얼린 exe 를 **실제로 띄워 본다.** 빌드가 되는 것과 실행되는 것은 다르다.
# `--noconsole` 이라 실기기에서는 죽어도 아무 메시지가 안 보이므로, 여기서 잡아야 한다.
#
# ★파일 이름을 A/B 로 비교한다. README 가 "비-ASCII 이름으로 빌드하면 부트로더가
#   실패한 전례가 있다" 고 적어 뒀는데, **빌드 후 이름을 바꾸는 것**도 같은 문제인지는
#   아무도 확인한 적이 없다. 어머니는 릴리즈 노트 안내대로 한글+공백 이름으로 바꾼다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt pyinstaller

      - name: exe 빌드
        shell: bash
        run: pyinstaller --onefile --noconsole --collect-all pyhwpx --name "hwp2img" src/run.py

      - name: 이름별로 띄워 본다 (A/B)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # 실기기에서 오류 로그가 떨어지는 자리를 미리 비운다
          $logs = @("$env:USERPROFILE\Desktop\hwp2img_오류.log", "$env:TEMP\hwp2img_오류.log")
          foreach ($l in $logs) { if (Test-Path $l) { Remove-Item $l -Force } }

          $cases = @(
            @{ Name = 'A. ASCII 이름';                  File = 'hwp2img.exe' },
            @{ Name = 'B. 한글+공백 (어머니가 쓰는 이름)'; File = '한글 사진으로 바꾸기.exe' },
            @{ Name = 'C. 한글, 공백 없음';               File = '한글사진으로바꾸기.exe' },
            @{ Name = 'D. ASCII+공백';                   File = 'hwp to img.exe' }
          )

          $failed = 0
          foreach ($c in $cases) {
            $target = Join-Path 'dist' $c.File
            Copy-Item 'dist\hwp2img.exe' $target -Force
            Write-Host "=============================================="
            Write-Host "$($c.Name)  →  $($c.File)"

            $p = Start-Process -FilePath (Resolve-Path $target) -PassThru
            Start-Sleep -Seconds 12

            $alive = -not $p.HasExited
            if ($alive) {
              Write-Host "  ✅ 12초 뒤에도 살아 있다 (창이 떴다는 뜻)"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            } else {
              Write-Host "  ❌ 죽었다. ExitCode=$($p.ExitCode)"
              $failed++
            }
            foreach ($l in $logs) {
              if (Test-Path $l) {
                Write-Host "  --- 오류 로그 ($l) ---"
                Get-Content $l -Tail 40 | ForEach-Object { Write-Host "  $_" }
                Remove-Item $l -Force
              }
            }
          }

          Write-Host "=============================================="
          if ($failed -gt 0) {
            Write-Host "::error::$failed 개 이름에서 실행 실패"
            exit 1
          }
          Write-Host "네 가지 이름 모두 정상 실행"

      # `shell_menu.current_exe()` 는 `sys.frozen` 에 걸려 있다. 유닛 테스트는 그 플래그를
      # monkeypatch 로 흉내낼 뿐이라 **진짜 얼린 exe 에서 등록되는지는 검증된 적이 없다.**
      # 위에서 exe 를 실제로 띄웠으니 여기서 그 결과를 잰다.
      - name: 얼린 exe 가 우클릭 메뉴를 실제로 등록했나
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmdKey = 'HKCU:\Software\Classes\hwp2img.convert\shell\open\command'
          if (-not (Test-Path $cmdKey)) {
            Write-Host "::error::얼린 exe 를 4번 띄웠는데 $cmdKey 가 없다 — 등록이 아예 안 됐다"
            exit 1
          }
          $command = (Get-ItemProperty -Path $cmdKey).'(default)'
          Write-Host "command = $command"

          # 마지막으로 띄운 이름을 가리켜야 한다 — exe 가 움직이면 따라오는 자가 치유.
          if ($command -notlike '*hwp to img.exe*') {
            Write-Host "::error::마지막으로 실행한 exe 를 안 가리킨다 (자가 치유 실패)"
            exit 1
          }
          # `"%1"` 인용이 살아 있어야 한다. 빠지면 공백 든 파일명만 조용히 실패한다.
          if ($command -notlike '* "%1"') {
            Write-Host "::error::`%1` 인용이 빠졌다 — 공백 든 파일명이 깨진다"
            exit 1
          }

          $progids = 'HKCU:\Software\Classes\.hwp\OpenWithProgids'
          if (-not (Get-ItemProperty -Path $progids -Name 'hwp2img.convert' -ErrorAction SilentlyContinue)) {
            Write-Host "::error::Win11 상단 경로(OpenWithProgids)에 등록이 안 됐다"
            exit 1
          }

          # 어머니의 파일 연결을 가로채면 안 된다 — .hwp 기본값은 비어 있어야 한다.
          $extDefault = (Get-ItemProperty -Path 'HKCU:\Software\Classes\.hwp' -ErrorAction SilentlyContinue).'(default)'
          if ($extDefault) {
            Write-Host "::error::.hwp 의 기본값을 썼다 ($extDefault) — 더블클릭이 한글로 안 간다"
            exit 1
          }
          Write-Host "✅ 얼린 exe 가 두 경로에 등록했고, 파일 연결은 안 건드렸다"

      # 릴리즈를 내지 않고 exe 를 받아 볼 수 있게 한다 — 실기기 확인용.
      - name: exe 를 아티팩트로 올린다
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwp2img-exe
          path: dist/hwp2img.exe
          if-no-files-found: error
